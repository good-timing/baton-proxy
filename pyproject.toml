[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baton-proxy"
dynamic = ["version"]
description = "MCP proxy that wraps a stdio server or bridges to a remote one, injects an annotation tool, and emits friction events."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Good Timing, Inc." }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.scripts]
baton-proxy = "baton_proxy.__main__:main"

[project.optional-dependencies]
# Data-residency: s3:// event sink (customer-owned bucket). boto3 is lazy-imported
# in S3Sink, so the base package stays zero-dep without it.
s3 = ["boto3>=1.34"]
# ruff is capped to a minor: `format --check` is a CI gate, and formatter
# output changes between minors would turn an untouched tree red.
dev = ["pytest>=7.0", "ruff>=0.15.17,<0.16", "jsonschema>=4.0"]

[tool.hatch.version]
path = "src/baton_proxy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/baton_proxy"]

[tool.ruff]
line-length = 100
target-version = "py311"
# baton-spec is a git submodule (separate repo, own CI/lint) — not part of
# this repo's own source tree.
extend-exclude = ["baton-spec"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "T20"]
# E501 line-too-long: handled by the formatter for everything it can wrap;
# the residue is long string literals (test fixtures, error bodies) the
# formatter won't break. Mirrors the SDK's ruff config.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# scan.py is a user-facing CLI subcommand; printing to stdout is its job
# (the report headline + progress lines). T20 (no-print) guards library code.
"src/baton_proxy/scan.py" = ["T201"]
# try/kit.py is the trial's user-facing CLI; its output IS the product (the
# printed entry and the receipt are what a reviewer checks). Same rule as scan.
"try/kit.py" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
